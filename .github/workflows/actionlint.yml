---
# yamllint disable rule:line-length
name: actionlint
permissions:
  contents: read
'on':
  push:
    branches:
      - master
    paths:
      - '.github/**'
  pull_request:
    branches:
      - master
    paths:
      - '.github/**'
jobs:
  actionlint:
    permissions:
      checks: write
      contents: read
      issues: write
      pull-requests: write
    timeout-minutes: 15
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: reviewdog/action-actionlint@v1.81.1
